# 2-worker baseline: Generator source on worker-a1 -> downstream -> File sink on worker-b.
# Hand-written for now; will be generated by scripts/gen_topology.py once we scale to N workers.
query: |
  SELECT VALUE * UINT64(3) AS SCALED_VALUE
  FROM GENERATOR_SOURCE
  INTO RESULTS

sinks:
  - name: RESULTS
    host: worker-b:8080          # sink lives on B
    schema:
      - name: SCALED_VALUE
        type: UINT64
    type: File
    config:
      output_format: CSV
      file_path: /output/results.csv
      append: false

logical:
  - name: GENERATOR_SOURCE
    schema:
      - name: VALUE
        type: UINT64

physical:
  - logical: GENERATOR_SOURCE
    host: worker-a1:8080         # source lives on A1
    parser_config:
      type: CSV
      field_delimiter: ","
    type: Generator
    source_config:
      generator_rate_type: FIXED
      generator_rate_config: emit_rate 25
      stop_generator_when_sequence_finishes: ALL
      seed: 5
      generator_schema: |
        SEQUENCE UINT64 0 250 1

workers:
  - host: worker-a1:8080
    data_address: worker-a1:9090
    max_operators: 10000
    downstream: [ worker-b:8080 ]
  - host: worker-b:8080
    data_address: worker-b:9090
    max_operators: 10000
